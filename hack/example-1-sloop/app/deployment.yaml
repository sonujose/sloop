apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    app: nginx
spec:
  replicas: {{ .replicaCount }}
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
      {{- range $key, $value := .selectors }}
        {{ $key }}: {{ $value }}
      {{- end }}
    spec:
      containers:
      - name: nginx
        image: {{ .image.repository }}:{{ .image.tag }}
        ports:
        - containerPort: 80
