apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels:
  {{- range $key, $value := .labels }}
    {{ $key }}: {{ $value }}
  {{- end }}
spec:
  type: {{ .service.type }}
  ports:
    - port: {{ .service.port }}
      targetPort: http
      protocol: {{ .service.protocol }}
      name: http
  selector:
  {{- range $key, $value := .selectors}}
    {{ $key }}: {{ $value }} 
  {{- end }}
