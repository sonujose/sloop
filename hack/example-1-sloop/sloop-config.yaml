apiVersion: app.sloop.io/v1 
Kind: Configurator
metadata:
  name: sloop-config
spec:
  template: default
  version: 1.0.0
  global:
    namespace: app-ns
    values:
      - app/values.yaml
  helmFile:
    repositories:
      - name: prometheus-community
      url: https://prometheus-community.github.io/helm-charts

    releases:
      - name: prom-norbac-ubuntu
        namespace: prometheus
        chart: prometheus-community/prometheus
        set:
          - name: rbac.create
            value: false
  components:
    - name: app
      enabled: true
      path: app/*.yaml
      namespace: app-ns
      set:
        - name : some-key
          value: some-value
        - name : some-key2
          value: some-value2
      valuesFiles:
        - app/values.yaml 

    