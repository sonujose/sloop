apiVersion: app.sloop.io/v1 
Kind: SloopConfig
metadata:
  name: sloop-config-dev
  namespace: sloop
spec:
  template: default
  version: 1.0.0
  global:
    namespace: app-ns
  components:
    - name: app
      enabled: true
      path: ./hack/example-1-sloop/app
      namespace: app-ns
      set:
        - name : .image.tag
          value: 1.14.34
      valuesFiles:
        - ./hack/example-1-sloop/values.yaml 
    - name: microservice
      enabled: true
      path: ./hack/example-1-sloop/app2
      namespace: app-ns
      set:
        - name: .image.tag
          value: 1.14.34
        - name: .image.repository
          value: nginx
        - name: .name
          value: updated-example-f3
      valuesFiles:
        - ./hack/example-1-sloop/values.yaml 