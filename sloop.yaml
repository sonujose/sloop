apiVersion: app.sloop.io/v1 
Kind: SloopPackage
metadata:
  name: sloop-package-dev
  namespace: sloop
spec:
  template: default
  version: 1.0.0
  global:
    namespace: app-ns
  components:
    - name: app
      enabled: true
      path: ./hack/example-1-sloop/app
      namespace: app-ns
      set:
        - name : .image.tag
          value: 3.23.3
        - name: .image.repository
          value: nginx
      valuesFiles:
        - ./hack/example-1-sloop/values.yaml 
        - ./hack/example-1-sloop/values.dev.yaml 
    - name: app2
      enabled: true
      path: ./hack/example-1-sloop/app2
      namespace: app-ns2
      set:
        - name: .name
          value: updated-example-f3
      valuesFiles:
        - ./hack/example-1-sloop/values.yaml 
        - ./hack/example-1-sloop/values.dev.yaml 